< !DOCTYPE html >
    <html>
        <head>
            <meta charset="utf-8">
                <link rel="stylesheet" href="popup.css">
                </head>
                <body>
                    <div class="header">
                        <h3>Paragraph Scroller</h3>
                        <span id="siteDomain" class="badge">Detecting...</span>
                    </div>

                    <div class="actions">
                        <button id="toggleBarsBtn" class="primary-btn">Adjust Threshold Bars</button>
                        <button id="startPickerBtn" class="secondary-btn">Exclude Element via Click</button>
                    </div>

                    <div class="section">
                        <h4>Active Site Exclusions</h4>
                        <div id="exclusionList" class="exclusion-list">
                            <span class="empty-state">No exclusions set for this site.</span>
                        </div>
                    </div>

                    <div class="section">
                        <h4>Blacklisted Patterns</h4>
                        <p class="subtext">e.g., *://*.youtube.com/* or https://site.com/*</p>
                        <div class="blacklist-input-group">
                            <input type="text" id="blacklistInput" placeholder="*://example.com/*">
                                <button id="addBlacklistBtn">Add</button>
                        </div>
                        <div id="blacklistView" class="blacklist-view"></div>
                    </div>

                    <div class="footer">
                        <button id="resetSiteBtn" class="reset-btn">Reset Site Settings</button>
                    </div>

                    <script src="popup.js"></script>
                </body>
            </html>
